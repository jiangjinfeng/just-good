<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#dff3ff">
<title>分与合田径大赛 · 10以内数的分与合</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden;background:#dff3ff;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
    color:#20303f;-webkit-user-select:none;user-select:none;touch-action:manipulation}
  button{font-family:inherit;cursor:pointer}
  .hidden{display:none !important}

  /* ---------- 整体骨架 ---------- */
  #app{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}

  /* ---------- 顶部条 ---------- */
  #hud{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:8px 16px;background:linear-gradient(#ffffff,#eef7ff);border-bottom:2px solid #dcebf8;
    box-shadow:0 2px 10px rgba(20,70,110,.06);z-index:5}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand .logo{font-size:clamp(20px,3vh,28px);filter:drop-shadow(0 2px 0 rgba(0,0,0,.12))}
  .brand h1{margin:0;font-size:clamp(16px,2.5vh,24px);letter-spacing:.5px;white-space:nowrap}
  .brand p{margin:1px 0 0;font-size:clamp(10px,1.4vh,12px);color:#7d8fa1;white-space:nowrap}
  .hud-stats{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:2px solid #e2eef9;border-radius:999px;
    padding:5px 12px;font-weight:700;font-size:clamp(12px,1.7vh,15px);color:#40566b;font-variant-numeric:tabular-nums}
  .icon-btn{width:clamp(34px,4.6vh,42px);height:clamp(34px,4.6vh,42px);border-radius:12px;border:2px solid #e2eef9;
    background:#fff;font-size:clamp(15px,2vh,19px);display:grid;place-items:center;transition:transform .1s,background .15s}
  .icon-btn:active{transform:translateY(2px);background:#f2f8fd}

  /* ---------- 田径场 ---------- */
  #stadium{position:relative;flex:0 0 30vh;min-height:172px;display:flex;flex-direction:column;overflow:hidden;
    border-bottom:3px solid #4d9a2e}
  .sky{position:relative;flex:0 0 33%;background:linear-gradient(#9fdcff,#d8f2ff 70%,#eafbff);overflow:hidden}
  .sun{position:absolute;right:6%;top:14%;width:clamp(26px,4vh,44px);height:clamp(26px,4vh,44px);border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#fff3b0,#ffd23f 60%,#ffb300);box-shadow:0 0 24px rgba(255,205,60,.75)}
  .cloud{position:absolute;height:26%;aspect-ratio:3.1;border-radius:999px;background:#fff;
    box-shadow:0 6px 14px rgba(90,150,190,.12);opacity:.95}
  .cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
  .cloud::before{width:52%;height:150%;left:8%;bottom:22%}
  .cloud::after{width:40%;height:120%;right:9%;bottom:26%}
  .c1{left:8%;top:24%;animation:drift 26s linear infinite}
  .c2{left:38%;top:46%;transform:scale(.8);animation:drift 34s linear infinite reverse}
  .c3{left:68%;top:20%;transform:scale(.62);animation:drift 30s linear infinite}
  @keyframes drift{0%{margin-left:-2%}50%{margin-left:2%}100%{margin-left:-2%}}
  .hills{position:absolute;left:0;right:0;bottom:0;height:46%;
    background:radial-gradient(120% 100% at 18% 100%,#8fcf6a 0 42%,transparent 43%),
               radial-gradient(90% 80% at 52% 100%,#7cc45c 0 46%,transparent 47%),
               radial-gradient(110% 90% at 84% 100%,#8fcf6a 0 40%,transparent 41%);
    opacity:.75}
  .lanes{position:relative;flex:1;display:flex;flex-direction:column;
    background:linear-gradient(#79c94d,#63b23c 70%,#57a335)}
  .lane{position:relative;flex:1;display:flex;align-items:center;gap:8px;padding:0 8px;min-height:0}
  .lane + .lane{border-top:3px dashed rgba(255,255,255,.42)}
  .lane-tag{flex:0 0 auto;display:flex;align-items:center;gap:4px;white-space:nowrap;
    background:rgba(255,255,255,.92);border-radius:999px;padding:2px 9px 2px 5px;box-shadow:0 2px 0 rgba(0,0,0,.12)}
  .tag-emoji{font-size:clamp(14px,2.2vh,22px);line-height:1}
  .tag-name{font-size:clamp(9px,1.35vh,12px);font-weight:800;color:#33485c}
  .lane-medal{font-size:clamp(10px,1.6vh,15px);line-height:1}
  .rail{position:relative;flex:1;height:100%;min-width:0}
  .rail::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px dashed rgba(255,255,255,.4)}
  .finish{position:absolute;right:10%;top:14%;bottom:14%;width:clamp(7px,.7vw,11px);border-radius:3px;
    background:repeating-conic-gradient(#22323f 0 25%,#ffffff 0 50%) 0 0/9px 9px;
    box-shadow:0 0 0 2px rgba(255,255,255,.85)}
  .runner{position:absolute;top:50%;left:12%;display:flex;align-items:center;gap:4px;
    transform:translate(-50%,-56%);transition:left .55s cubic-bezier(.34,1.45,.64,1);z-index:2}
  .runner-svg{height:clamp(32px,5.2vh,50px);width:auto;display:block;overflow:visible;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.18));animation:bodybob .52s ease-in-out infinite}
  .runner-svg .leg{fill:none;stroke:var(--body,#b9814f);stroke-width:6;stroke-linecap:round;
    transform-box:view-box;animation:legswing .52s ease-in-out infinite}
  .runner-svg .l1{animation-delay:-.13s}
  .runner-svg .l2{animation-delay:-.39s}
  .runner-svg .l3{animation-delay:-.26s}
  .runner-svg .l4{animation-delay:0s}
  .runner-svg .dust{transform-box:view-box;transform-origin:30px 82px;
    animation:dustpuff .52s ease-out infinite}
  @keyframes legswing{0%,100%{transform:rotate(-24deg)}50%{transform:rotate(28deg)}}
  @keyframes bodybob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
  @keyframes dustpuff{0%{opacity:.5;transform:translateX(0) scale(1)}100%{opacity:0;transform:translateX(-7px) scale(1.6)}}
  .badge{background:#fff;border:2px solid var(--c,#3f8cff);color:var(--c,#3f8cff);border-radius:999px;
    padding:0 6px;font-weight:900;font-size:clamp(9px,1.5vh,13px);white-space:nowrap;
    box-shadow:0 2px 0 rgba(0,0,0,.1)}

  /* ---------- 答题区 ---------- */
  #arena{flex:1 1 auto;display:grid;gap:clamp(8px,1.1vw,16px);padding:clamp(8px,1.2vh,16px);min-height:0}
  #arena[data-players="4"]{grid-template-columns:repeat(4,minmax(0,560px))}
  #arena[data-players="3"]{grid-template-columns:repeat(3,minmax(0,620px))}
  #arena[data-players="2"]{grid-template-columns:repeat(2,minmax(0,720px))}
  #arena{justify-content:center}
  .card{position:relative;display:flex;flex-direction:column;gap:clamp(5px,.9vh,10px);min-height:0;
    background:#fff;border:3px solid var(--c-soft,#cfe2f6);border-radius:clamp(16px,2vh,24px);
    padding:clamp(8px,1.1vh,14px) clamp(9px,1vw,16px) clamp(10px,1.3vh,16px);
    box-shadow:0 8px 0 rgba(25,70,105,.07),0 6px 22px rgba(25,70,105,.1);transition:box-shadow .2s,border-color .2s}
  .card.good{border-color:#39c37a;box-shadow:0 0 0 4px #b9f2d2 inset,0 8px 0 rgba(25,70,105,.07)}
  .card.bad{border-color:#ff6b6b;animation:shake .42s}
  @keyframes shake{0%,100%{translate:0}20%{translate:-7px}40%{translate:6px}60%{translate:-4px}80%{translate:3px}}
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:6px}
  .who{display:flex;align-items:center;gap:8px;min-width:0}
  .avatar{flex:0 0 auto;width:clamp(48px,7.2vh,74px);height:clamp(48px,7.2vh,74px);border-radius:50%;
    display:grid;place-items:center;font-size:clamp(30px,5.1vh,52px);line-height:1;
    background:var(--c-soft,#eaf2fb);border:3px solid var(--c,#3f8cff);
    box-shadow:inset 0 0 0 3px #fff,0 3px 0 rgba(25,70,105,.12)}
  .who-txt{min-width:0}
  .who-txt b{display:block;font-size:clamp(12px,1.9vh,17px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who-txt small{display:block;font-size:clamp(9px,1.35vh,12px);color:#8395a7;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .score{flex:0 0 auto;display:flex;align-items:baseline;font-weight:900;color:var(--c,#3f8cff);
    font-variant-numeric:tabular-nums;line-height:1}
  .score b{font-size:clamp(20px,3.3vh,32px)}
  .score span{font-size:clamp(11px,1.6vh,15px);opacity:.7}

  /* 分与合图示 */
  .q{display:flex;flex-direction:column;align-items:center;gap:0}
  .whole{width:clamp(42px,6.8vh,64px);height:clamp(42px,6.8vh,64px);border-radius:50%;padding:0;
    border:4px solid var(--c,#3f8cff);background:var(--c-soft,#eaf2fb);display:grid;place-items:center;
    font-family:inherit;font-size:clamp(22px,4.2vh,40px);font-weight:900;color:var(--c,#3f8cff);line-height:1;
    box-shadow:0 3px 0 rgba(25,70,105,.08)}
  .whole.blank{border-style:dashed;background:#fbfdff;cursor:pointer;
    animation:slotpulse 1.8s ease-in-out infinite}
  .whole.blank.filled{animation:none;border-style:solid;background:var(--c-soft)}
  .whole.given{cursor:default}
  .fork{width:min(80%,260px);height:clamp(14px,2.2vh,24px);display:block;margin-top:-2px}
  .fork path{fill:none;stroke:var(--c,#3f8cff);stroke-width:4;stroke-linecap:round;opacity:.9}
  .parts{display:grid;grid-template-columns:1fr 1fr;gap:16%;width:min(86%,300px)}
  .part{height:clamp(32px,5.4vh,54px);border-radius:clamp(10px,1.6vh,16px);
    border:3px solid var(--c,#3f8cff);background:var(--c-soft,#eaf2fb);color:var(--c,#3f8cff);
    font-size:clamp(17px,3vh,30px);font-weight:900;line-height:1;padding:0;font-family:inherit;
    transition:transform .1s,background .15s,border-color .15s,color .15s}
  .part.blank{border-style:dashed;background:#fbfdff;color:#9fb2c4;cursor:pointer;
    animation:slotpulse 1.8s ease-in-out infinite}
  .part.blank.filled{animation:none;border-style:solid;border-color:var(--c);background:var(--c-soft);color:var(--c)}
  .part.given{cursor:default}
  @keyframes slotpulse{0%,100%{border-color:var(--c-soft,#cfe2f6)}50%{border-color:var(--c,#3f8cff)}}

  /* 数字键盘 */
  .pad{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;
    gap:clamp(4px,.8vh,9px)}
  .num{border:none;border-radius:clamp(9px,1.4vh,14px);background:#f0f6fb;color:#26384a;
    font-weight:800;font-size:clamp(15px,2.5vh,25px);line-height:1;box-shadow:0 3px 0 #d8e5f0;
    transition:transform .07s,box-shadow .07s,background .15s;font-variant-numeric:tabular-nums}
  .num:active{transform:translateY(3px);box-shadow:none;background:var(--c-soft,#e3eef9)}

  .acts{display:grid;grid-template-columns:1fr 1.5fr;gap:8px}
  .acts button{border:none;border-radius:clamp(10px,1.5vh,14px);font-weight:900;
    font-size:clamp(13px,1.9vh,18px);padding:clamp(7px,1.2vh,12px) 0;transition:transform .08s,box-shadow .08s}
  .ghost{background:#eef4f9;color:#5a6f83;box-shadow:0 3px 0 #dbe6ef}
  .primary{background:var(--c,#3f8cff);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.18)}
  .acts button:active{transform:translateY(3px);box-shadow:none}
  .card.finished .pad,.card.finished .acts{opacity:.45;pointer-events:none}
  .card.finished .q{opacity:.75}
  .done-banner{position:absolute;inset:0;border-radius:inherit;display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:clamp(4px,.8vh,9px);padding:10px;text-align:center;z-index:6;
    background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(240,247,253,.97))}
  .card.finished .done-banner{display:flex}
  .done-emblem{width:clamp(84px,15vh,150px);height:clamp(84px,15vh,150px);display:grid;place-items:center;
    animation:donePop .62s cubic-bezier(.2,1.6,.5,1)}
  .done-emblem svg{width:100%;height:100%;display:block;filter:drop-shadow(0 10px 16px rgba(120,90,20,.28))}
  .flag-badge{width:clamp(84px,15vh,150px);height:clamp(84px,15vh,150px);display:grid;place-items:center;
    animation:donePop .62s cubic-bezier(.2,1.6,.5,1)}
  .flag-badge svg{width:100%;height:100%;display:block;filter:drop-shadow(0 10px 16px rgba(40,70,100,.2))}
  .done-title{font-size:clamp(15px,2.6vh,24px);color:#2f4858}
  @keyframes donePop{0%{transform:scale(.25);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
  .done-sub{font-size:clamp(11px,1.8vh,15px);color:#6b7f90}
  .plusone{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-weight:900;
    color:#2bb673;font-size:clamp(26px,4.6vh,44px);text-shadow:0 3px 0 rgba(255,255,255,.9);
    pointer-events:none;animation:floatup .8s ease-out forwards;z-index:4}
  @keyframes floatup{0%{opacity:0;translate:0 10px}25%{opacity:1}100%{opacity:0;translate:0 -60px}}

  /* ---------- 遮罩通用 ---------- */
  .overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:18px;
    background:radial-gradient(90% 80% at 50% 0%,#eaf9ff,#cfeaff 60%,#b9e2ff)}
  .panel{width:min(820px,94vw);max-height:94vh;overflow:auto;background:#fff;border:4px solid #dceefb;
    border-radius:clamp(20px,3vh,30px);padding:clamp(18px,3.4vh,38px);text-align:center;
    box-shadow:0 24px 60px rgba(20,70,110,.25)}

  /* 开始页 */
  .mascot-row{font-size:clamp(30px,5.4vh,52px);letter-spacing:6px;line-height:1}
  .mascot-row span{display:inline-block;animation:hop 1.6s ease-in-out infinite}
  .mascot-row span:nth-child(2){animation-delay:.15s}
  .mascot-row span:nth-child(3){animation-delay:.3s}
  .mascot-row span:nth-child(4){animation-delay:.45s}
  @keyframes hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-14%)}}
  .game-title{margin:10px 0 4px;font-size:clamp(28px,6vh,56px);letter-spacing:2px;
    background:linear-gradient(#ff9d2e,#ff6b35);-webkit-background-clip:text;background-clip:text;color:transparent;
    -webkit-text-stroke:1px rgba(255,120,40,.25)}
  .game-title.small{font-size:clamp(24px,4.6vh,40px)}
  .game-sub{margin:0 0 14px;font-size:clamp(13px,2vh,18px);color:#6b8095}
  .game-sub:empty{display:none}
  .chips{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-bottom:clamp(14px,2.4vh,24px)}
  .chips .chip{font-size:clamp(12px,1.8vh,15px)}
  .big-btn{border:none;border-radius:999px;padding:clamp(12px,2vh,18px) clamp(34px,5vw,64px);
    font-size:clamp(18px,3vh,26px);font-weight:900;letter-spacing:2px;color:#fff;
    background:linear-gradient(#ffb03a,#ff8a00);box-shadow:0 8px 0 #d97400;transition:transform .1s,box-shadow .1s}
  .big-btn:active{transform:translateY(4px);box-shadow:0 4px 0 #d97400}
  .link-btn{margin-top:14px;background:none;border:none;color:#5d7891;font-size:clamp(12px,1.8vh,15px);
    font-weight:700;text-decoration:underline;text-underline-offset:3px}
  .tiny{margin:clamp(14px,2.4vh,24px) auto 0;max-width:560px;font-size:clamp(11px,1.6vh,14px);
    line-height:1.7;color:#8ba0b3}

  /* 倒计时 */
  #countdown{background:rgba(12,40,60,.55);backdrop-filter:blur(2px);z-index:70}
  .cd-num{font-size:clamp(90px,26vh,240px);font-weight:900;color:#fff;line-height:1;
    text-shadow:0 10px 0 rgba(0,0,0,.18);animation:cdpop .55s cubic-bezier(.2,1.6,.5,1)}
  .cd-num.go{color:#ffd23f}
  @keyframes cdpop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}

  /* 结果页 */
  .rank-list{display:flex;flex-direction:column;gap:8px;margin:clamp(12px,2vh,20px) 0 clamp(16px,2.6vh,26px)}
  .rank-row{display:grid;grid-template-columns:44px 1fr auto auto;align-items:center;gap:10px;
    background:#f7fbfe;border:2px solid #e6f0f9;border-radius:14px;padding:10px 14px;text-align:left}
  .rank-row.first{background:linear-gradient(90deg,#fff8dd,#fffdf5);border-color:#ffe08a}
  .rank-row .rk{font-size:clamp(20px,3vh,28px);text-align:center;display:grid;place-items:center}
  .rank-row .rk svg{width:clamp(26px,4vh,38px);height:auto;display:block;
    filter:drop-shadow(0 2px 4px rgba(120,90,20,.2))}
  .rank-row .who2{font-weight:800;font-size:clamp(14px,2.1vh,19px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rank-row .sc{font-weight:900;color:#2e8b57;font-size:clamp(13px,2vh,18px);font-variant-numeric:tabular-nums}
  .rank-row .tm{color:#7f93a6;font-size:clamp(12px,1.8vh,15px);font-variant-numeric:tabular-nums;min-width:70px;text-align:right}
  .row-btns{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
  .row-btns .big-btn{font-size:clamp(15px,2.3vh,20px);padding:clamp(10px,1.7vh,15px) clamp(24px,3.4vw,42px)}
  .row-btns .ghost-btn{background:#eef4f9;color:#41627e;box-shadow:0 6px 0 #d7e5f0}
  .row-btns .ghost-btn:active{box-shadow:0 2px 0 #d7e5f0}

  /* 设置 */
  #settingsDrawer{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:18px;
    background:rgba(14,40,60,.45)}
  .drawer-card{width:min(560px,94vw);max-height:92vh;overflow:auto;background:#fff;border-radius:24px;
    padding:clamp(18px,3vh,28px);box-shadow:0 24px 60px rgba(10,40,70,.35)}
  .drawer-card h2{margin:0 0 6px;font-size:clamp(18px,2.8vh,24px)}
  .drawer-card .hint{margin:0 0 12px;color:#8ba0b3;font-size:clamp(11px,1.6vh,13px)}
  .field{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;
    border-bottom:1px dashed #e6eef6;flex-wrap:wrap}
  .field > label{font-weight:700;font-size:clamp(13px,1.9vh,16px);color:#33485c}
  .seg{display:flex;gap:4px;background:#f2f7fb;border-radius:12px;padding:4px}
  .seg button{border:none;background:transparent;padding:7px 13px;border-radius:9px;font-weight:700;
    color:#5c7185;font-size:clamp(12px,1.7vh,14px)}
  .seg button.on{background:#fff;color:#1b6fd6;box-shadow:0 2px 6px rgba(20,70,110,.14)}
  .drawer-acts{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
  .drawer-acts button{border:none;border-radius:12px;padding:10px 22px;font-weight:800;font-size:14px}
  .drawer-acts .cancel{background:#eef4f9;color:#5a6f83}
  .drawer-acts .ok{background:#2f8cff;color:#fff;box-shadow:0 3px 0 #1b6bd6}
  .end-now{width:100%;margin-top:14px;border:none;border-radius:12px;padding:11px;
    background:#fff1f1;color:#d24b4b;font-weight:800;font-size:clamp(12px,1.7vh,14px)}
  .end-now:active{background:#ffe4e4}

  /* 窄屏兜底 */
  @media (max-width:760px), (orientation:portrait), (max-height:520px){
    #app{height:auto;min-height:100dvh;overflow:auto}
    #hud{position:sticky;top:0}
    #stadium{flex:0 0 24vh;min-height:150px}
    #arena,#arena[data-players="3"],#arena[data-players="4"]{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(330px,auto)}
    #arena[data-players="2"]{grid-template-columns:minmax(0,1fr);grid-auto-rows:minmax(420px,auto)}
    .game-title{font-size:clamp(26px,8.4vw,40px);letter-spacing:1px}
    .panel{padding:18px 14px}
    .brand p{display:none}
    .brand h1{font-size:15px}
    .hud-stats .chip{display:none}
    .hud-stats .chip#clock{display:inline-flex}
  }
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="brand">
      <span class="logo">🏁</span>
      <div>
        <h1>分与合田径大赛</h1>
        <p>10以内数的分与合 · 四人对战</p>
      </div>
    </div>
    <div class="hud-stats">
      <div class="chip" id="clock">⏱ 00:00</div>
      <div class="chip" id="goalChip">🎯 10 题</div>

<div id="settingsDrawer" class="hidden">

<script>
(function(){
  'use strict';

  var $  = function(sel, root){ return (root || document).querySelector(sel); };
  var $$ = function(sel, root){ return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };

  var MASCOTS = [
    { key:'rabbit', name:'小兔',   emoji:'🐰', color:'#ff5d73' },
    { key:'bear',   name:'小熊',   emoji:'🐻', color:'#3f8cff' },
    { key:'fox',    name:'小狐狸', emoji:'🦊', color:'#ff9f1c' },
    { key:'cat',    name:'小猫',   emoji:'🐱', color:'#22b07d' }
  ];
  var STORE_KEY = 'fen-yu-he-race-cfg-v1';
  var DEFAULTS  = { players:4, max:10, goal:10, sound:true };

  var CFG = loadCfg();
  var URL_MUTE = /(?:\?|&)mute=1(?:&|$)/.test(location.search);
  if (URL_MUTE) CFG.sound = false;

  var P = [];                       // 玩家状态
  var race = { running:false, t0:0, timer:0, order:[] };

  /* ---------------- 工具 ---------------- */
  function loadCfg(){
    try {
      var raw = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
      return {
        players: [2,3,4].indexOf(+raw.players) >= 0 ? +raw.players : DEFAULTS.players,
        max:     [5,6,10].indexOf(+raw.max) >= 0 ? +raw.max : DEFAULTS.max,
        goal:    [5,10,15].indexOf(+raw.goal) >= 0 ? +raw.goal : DEFAULTS.goal,
        sound:   typeof raw.sound === 'boolean' ? raw.sound : DEFAULTS.sound
      };
    } catch(e){ return { players:4, max:10, goal:10, sound:true }; }
  }
  function saveCfg(){
    if (URL_MUTE) return;   // 静音试玩不写入本机设置
    try { localStorage.setItem(STORE_KEY, JSON.stringify(CFG)); } catch(e){}
  }
  function pad2(n){ return n < 10 ? '0' + n : '' + n; }
  function clockText(ms){
    var s = Math.floor(ms / 1000);
    return pad2(Math.floor(s / 60)) + ':' + pad2(s % 60);
  }
  function secText(ms){ return (ms / 1000).toFixed(1) + ' 秒'; }
  function elapsed(){ return race.t0 ? (performance.now() - race.t0) : 0; }
  function cardEl(i){ return $('#arena .card[data-p="' + i + '"]'); }
  function alpha(hex, a){
    var h = hex.replace('#','');
    var r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }

  /* ---------------- 音效 ---------------- */
  var actx = null;
  function ensureAudio(){
    if (!CFG.sound) return null;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      return actx;
    } catch(e){ return null; }
  }
  function tone(freq, delay, dur, type, vol){
    var ac = ensureAudio();
    if (!ac) return;
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    var t = ac.currentTime + (delay || 0);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol || 0.12, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.06);
  }
  function sfxTap(){ tone(620, 0, .06, 'triangle', .05); }
  function sfxCorrect(){ tone(740, 0, .12, 'sine', .10); tone(1180, .09, .20, 'sine', .09); }
  function sfxWrong(){ tone(170, 0, .24, 'square', .08); }
  function sfxWin(){ [523,659,784,1046].forEach(function(f,k){ tone(f, k*.10, .28, 'sine', .09); }); }

  /* ---------------- 出题 ---------------- */
  function makeQuestion(exclude){
    var lo = 2, hi = Math.max(CFG.max, 3), whole, guard = 0;
    do { whole = lo + Math.floor(Math.random() * (hi - lo + 1)); guard++; }
    while (whole === exclude && guard < 30);
    var a = 1 + Math.floor(Math.random() * (whole - 1));
    var b = whole - a;
    var r = Math.random();
    var blank = r < 0.3 ? 'whole' : (Math.random() < 0.5 ? 'a' : 'b');
    return { whole: whole, a: a, b: b, blank: blank, pick: null };
  }

  /* ---------------- 构建设备 ---------------- */
  function buildUI(){
    var n = CFG.players;
    var lanes = $('#lanes');
    lanes.innerHTML = MASCOTS.slice(0, n).map(function(m, i){
      return '' +
        '<div class="lane" style="--c:' + m.color + '">' +
          '<div class="lane-tag">' +
            '<span class="tag-emoji">' + m.emoji + '</span>' +
            '<span class="tag-name">' + (i + 1) + '号</span>' +
            '<span class="lane-medal" data-lane-medal="' + i + '"></span>' +
          '</div>' +
          '<div class="rail">' +
            '<div class="finish" aria-hidden="true"></div>' +
            '<div class="runner" data-runner="' + i + '" style="left:10%">' +
              runnerSVG(m) +
              '<span class="badge" data-badge="' + i + '">0/' + CFG.goal + '</span>' +
            '</div>' +
          '</div>' +
        '</div>';
    }).join('');

    var arena = $('#arena');
    arena.dataset.players = String(n);
    arena.innerHTML = MASCOTS.slice(0, n).map(cardHTML).join('');

    $('#goalChip').textContent = '🎯 ' + CFG.goal + ' 题';
    var mode = { 2:'双人对战', 3:'三人对战', 4:'四人对战' }[n] || '';
    var sub = $('.brand p');
    if (sub) sub.textContent = CFG.max + '以内数的分与合 · ' + mode;
    syncSummary();
  }

  function cardHTML(m, i){
    var nums = [], rest = CFG.max % 3, span = rest ? (4 - rest) : 0;
    for (var k = 1; k <= CFG.max; k++){
      var extra = (k === CFG.max && span) ? ' style="grid-column:span ' + span + '"' : '';
      nums.push('<button class="num" data-num="' + k + '" data-p="' + i + '"' + extra + '>' + k + '</button>');
    }
    return '' +
      '<article class="card" data-p="' + i + '" style="--c:' + m.color + ';--c-soft:' + alpha(m.color, .18) + '">' +
        '<div class="card-head">' +
          '<div class="who">' +
            '<span class="avatar">' + m.emoji + '</span>' +
            '<div class="who-txt"><b>' + (i + 1) + '号 · ' + m.name + '</b>' +
              '<small data-medal="' + i + '">准备出发</small></div>' +
          '</div>' +
          '<div class="score" data-score="' + i + '"><b>0</b><span>/' + CFG.goal + '</span></div>' +
        '</div>' +
        '<div class="q">' +
          '<button class="whole" data-whole="' + i + '" data-p="' + i + '">?</button>' +
          '<svg class="fork" viewBox="0 0 220 34" preserveAspectRatio="none" aria-hidden="true">' +
            '<path d="M110 1 V15" vector-effect="non-scaling-stroke"/>' +
            '<path d="M110 15 L56 33" vector-effect="non-scaling-stroke"/>' +
            '<path d="M110 15 L164 33" vector-effect="non-scaling-stroke"/>' +
          '</svg>' +
          '<div class="parts">' +
            '<button class="part" data-part="a" data-p="' + i + '">?</button>' +
            '<button class="part" data-part="b" data-p="' + i + '">?</button>' +
          '</div>' +
        '</div>' +
        '<div class="pad" data-pad="' + i + '">' + nums.join('') + '</div>' +
        '<div class="acts">' +
          '<button class="ghost" data-act="clear" data-p="' + i + '">清空</button>' +
          '<button class="primary" data-act="ok" data-p="' + i + '">确定</button>' +
        '</div>' +
        '<div class="done-banner" data-done="' + i + '">' +
          '<div class="done-emblem" data-emblem="' + i + '"></div>' +
          '<b class="done-title">冲线！</b>' +
          '<span class="done-sub"></span>' +
        '</div>' +
      '</article>';
  }

  /* ---------------- 跑道上的小动物（奔跑姿态） ---------------- */
  var RUNNER_PALETTE = {
    rabbit:{ body:'#f2f5fb', light:'#ffffff', inner:'#ffc9d6', headR:13.5, muzzle:'99,39,6.5,5', nose:'104,37' },
    bear:  { body:'#b9814f', light:'#f2dcbf', inner:'#8f6238', headR:14.5, muzzle:'96.5,39.5,5.6,4.6', nose:'101,37.5' },
    fox:   { body:'#f08a3c', light:'#fff3e6', inner:'#d96b21', headR:13.5, muzzle:'99.5,39,6,4.8', nose:'104,37' },
    cat:   { body:'#aab6c3', light:'#f6f9fc', inner:'#f0b7c4', headR:13.5, muzzle:'98,39,5.8,4.8', nose:'102.5,37' }
  };

  function runnerSVG(m){
    var c = RUNNER_PALETTE[m.key] || RUNNER_PALETTE.rabbit;
    var team = m.color;
    var ink = 'rgba(40,50,60,.14)';
    var mz = c.muzzle.split(','), ns = c.nose.split(',');
    var ears = '', tail = '';

    if (m.key === 'rabbit'){
      ears = '<ellipse cx="82" cy="18" rx="5.2" ry="14" transform="rotate(-18 82 18)" fill="' + c.body + '" stroke="' + ink + '" stroke-width="1.2"/>' +
             '<ellipse cx="90" cy="19" rx="4.6" ry="12.5" transform="rotate(-4 90 19)" fill="' + c.body + '" stroke="' + ink + '" stroke-width="1.2"/>' +
             '<ellipse cx="82" cy="19" rx="2.4" ry="9.2" transform="rotate(-18 82 19)" fill="' + c.inner + '"/>' +
             '<ellipse cx="90" cy="20" rx="2.1" ry="7.8" transform="rotate(-4 90 20)" fill="' + c.inner + '"/>';
      tail = '<circle cx="27" cy="49" r="7" fill="' + c.light + '" stroke="' + ink + '" stroke-width="1.2"/>';
    } else if (m.key === 'bear'){
      ears = '<circle cx="78" cy="20" r="8" fill="' + c.body + '"/><circle cx="97" cy="20" r="8" fill="' + c.body + '"/>' +
             '<circle cx="78" cy="20" r="4" fill="' + c.inner + '"/><circle cx="97" cy="20" r="4" fill="' + c.inner + '"/>';
      tail = '<circle cx="30" cy="46" r="4" fill="' + c.body + '"/>';
    } else if (m.key === 'fox'){
      ears = '<path d="M75 27 L81 5 L92 24 Z" fill="' + c.body + '"/><path d="M88 24 L98 6 L104 27 Z" fill="' + c.body + '"/>' +
             '<path d="M79 23 L82 12 L88 22 Z" fill="' + c.inner + '"/><path d="M91 22 L95.5 12 L100 23 Z" fill="' + c.inner + '"/>';
      tail = '<path d="M34 52 C20 50 12 40 18 28 C28 36 36 40 44 46 Z" fill="' + c.body + '"/>' +
             '<path d="M18 28 C22 35 26 40 32 44" stroke="' + c.light + '" stroke-width="4" fill="none" stroke-linecap="round"/>';
    } else {
      ears = '<path d="M77 27 L82 9 L92 24 Z" fill="' + c.body + '"/><path d="M88 24 L97 10 L102 27 Z" fill="' + c.body + '"/>' +
             '<path d="M80.5 23 L83.5 14.5 L88.5 22 Z" fill="' + c.inner + '"/><path d="M90.5 22 L94.5 15 L97.5 23 Z" fill="' + c.inner + '"/>';
      tail = '<path d="M34 53 C22 54 16 44 22 34" fill="none" stroke="' + c.body + '" stroke-width="5.5" stroke-linecap="round"/>';
    }

    return '' +
      '<svg class="runner-svg" viewBox="0 0 120 96" style="--body:' + c.body + '" aria-hidden="true">' +
        tail +
        '<path class="leg l1" d="M38 56 C32 64 28 74 24 82" style="transform-origin:38px 56px"/>' +
        '<path class="leg l2" d="M78 56 C84 64 86 74 84 82" style="transform-origin:78px 56px"/>' +
        '<path d="M72 49 C62 52 56 58 52 66" fill="none" stroke="' + team + '" stroke-width="4.5" stroke-linecap="round" opacity=".85"/>' +
        ears +
        '<circle cx="88" cy="34" r="' + c.headR + '" fill="' + c.body + '" stroke="' + ink + '" stroke-width="1.4"/>' +
        '<ellipse cx="56" cy="52" rx="26" ry="15" transform="rotate(-8 56 52)" fill="' + c.body + '" stroke="' + ink + '" stroke-width="1.4"/>' +
        '<ellipse cx="62" cy="57" rx="14" ry="7" transform="rotate(-8 62 57)" fill="' + c.light + '" opacity=".9"/>' +
        '<path class="leg l3" d="M44 56 C48 66 44 76 40 84" style="transform-origin:44px 56px"/>' +
        '<path class="leg l4" d="M74 56 C72 66 74 76 78 84" style="transform-origin:74px 56px"/>' +
        '<path d="M71 49 Q80 54 86 45" fill="none" stroke="' + team + '" stroke-width="6" stroke-linecap="round"/>' +
        '<ellipse cx="' + mz[0] + '" cy="' + mz[1] + '" rx="' + mz[2] + '" ry="' + mz[3] + '" fill="' + c.light + '"/>' +
        '<circle cx="93" cy="30" r="2.7" fill="#2b2f36"/>' +
        '<circle cx="93.9" cy="29.1" r=".9" fill="#fff"/>' +
        '<circle cx="' + ns[0] + '" cy="' + ns[1] + '" r="2" fill="#2b2f36"/>' +
        '<path d="M' + (+ns[0] - 4.5) + ' ' + (+ns[1] + 3.5) + ' q2.2 2.6 4.5 0" fill="none" stroke="#6b5348" stroke-width="1.4" stroke-linecap="round"/>' +
        '<circle cx="84" cy="38" r="3.2" fill="#ff9db0" opacity=".32"/>' +
        '<g class="dust" fill="#fff">' +
          '<circle cx="20" cy="86" r="3.2" opacity=".55"/>' +
          '<circle cx="12" cy="80" r="2.2" opacity=".45"/>' +
          '<circle cx="7" cy="87" r="2.6" opacity=".5"/>' +
        '</g>' +
      '</svg>';
  }

  /* ---------------- 奖杯 ---------------- */
  var TROPHY = [
    { body:'#f7c948', dark:'#bf8a04', shine:'#fff6d4' },
    { body:'#dde5ee', dark:'#8b98a9', shine:'#ffffff' },
    { body:'#d99a63', dark:'#9c5f2c', shine:'#ffe3c8' }
  ];

  function trophySVG(place){
    var t = TROPHY[place - 1] || TROPHY[0];
    return '<svg viewBox="0 0 100 100" aria-hidden="true">' +
      '<path d="M27 24 C13 24 11 43 26 47" fill="none" stroke="' + t.dark + '" stroke-width="6" stroke-linecap="round"/>' +
      '<path d="M73 24 C87 24 89 43 74 47" fill="none" stroke="' + t.dark + '" stroke-width="6" stroke-linecap="round"/>' +
      '<path d="M25 18 H75 V40 C75 56 64 66 50 66 C36 66 25 56 25 40 Z" fill="' + t.body + '" stroke="' + t.dark + '" stroke-width="2.5"/>' +
      '<path d="M33 24 C33 42 39 52 47 59" fill="none" stroke="' + t.shine + '" stroke-width="5" stroke-linecap="round" opacity=".7"/>' +
      '<circle cx="50" cy="38" r="14" fill="#fff" opacity=".96"/>' +
      '<text x="50" y="45.5" text-anchor="middle" font-size="20" font-weight="900" fill="' + t.dark + '">' + place + '</text>' +
      '<rect x="44" y="65" width="12" height="11" fill="' + t.dark + '"/>' +
      '<rect x="30" y="76" width="40" height="10" rx="5" fill="' + t.dark + '"/>' +
      '<rect x="32" y="77.5" width="36" height="3" rx="1.5" fill="#fff" opacity=".28"/>' +
    '</svg>';
  }

  function flagSVG(){
    var cells = '', r, c;
    for (r = 0; r < 3; r++){
      for (c = 0; c < 4; c++){
        if ((r + c) % 2 === 0){
          cells += '<rect x="' + (39 + c * 6.8) + '" y="' + (31 + r * 6.8) + '" width="6.8" height="6.8" fill="#27394a"/>';
        }
      }
    }
    return '<svg viewBox="0 0 100 100" aria-hidden="true">' +
      '<circle cx="50" cy="50" r="34" fill="#eef4fa"/>' +
      '<path d="M39 74 V28" stroke="#33485c" stroke-width="6" stroke-linecap="round"/>' +
      '<rect x="39" y="31" width="27.2" height="20.4" fill="#fff"/>' +
      cells +
      '<rect x="39" y="31" width="27.2" height="20.4" fill="none" stroke="#33485c" stroke-width="2.5"/>' +
    '</svg>';
  }

  /* ---------------- 渲染 ---------------- */
  function renderQuestion(p){
    var card = cardEl(p.i);
    if (!card) return;
    var q = p.q;
    var wholeEl = $('[data-whole="' + p.i + '"]', card);
    var partA = $('[data-part="a"][data-p="' + p.i + '"]', card);
    var partB = $('[data-part="b"][data-p="' + p.i + '"]', card);
    var wb = q.blank === 'whole', ab = q.blank === 'a', bb = q.blank === 'b';
    wholeEl.textContent = wb ? (q.pick === null ? '?' : String(q.pick)) : String(q.whole);
    partA.textContent = ab ? (q.pick === null ? '?' : String(q.pick)) : String(q.a);
    partB.textContent = bb ? (q.pick === null ? '?' : String(q.pick)) : String(q.b);
    wholeEl.classList.toggle('blank', wb);
    partA.classList.toggle('blank', ab);
    partB.classList.toggle('blank', bb);
    wholeEl.classList.toggle('given', !wb);
    partA.classList.toggle('given', !ab);
    partB.classList.toggle('given', !bb);
    wholeEl.classList.toggle('filled', wb && q.pick !== null);
    partA.classList.toggle('filled', ab && q.pick !== null);
    partB.classList.toggle('filled', bb && q.pick !== null);
  }
  function updateScore(p){
    var card = cardEl(p.i);
    if (!card) return;
    $('[data-score="' + p.i + '"] b', card).textContent = String(p.score);
  }
  function updateRunner(p){
    var runner = $('[data-runner="' + p.i + '"]');
    if (!runner) return;
    var pct = 10 + 86 * (p.score / CFG.goal);
    runner.style.left = pct + '%';
    $('[data-badge="' + p.i + '"]').textContent = p.score + '/' + CFG.goal;
  }
  function floatPlus(p){
    var card = cardEl(p.i);
    if (!card) return;
    var s = document.createElement('span');
    s.className = 'plusone';
    s.textContent = '+1';
    card.appendChild(s);
    setTimeout(function(){ s.remove(); }, 850);
  }
  function hint(p, text){
    var card = cardEl(p.i);
    if (!card) return;
    var el = card.querySelector('.who-txt small');
    var old = el.textContent;
    var color = el.style.color;
    el.textContent = text;
    el.style.color = '#e8833a';
    setTimeout(function(){ el.textContent = old; el.style.color = color || ''; }, 1100);
  }

  /* ---------------- 交互 ---------------- */
  function tapNumber(pi, n){
    var p = P[pi];
    if (!p || p.done || p.lock || !race.running) return;
    p.q.pick = n;
    renderQuestion(p);
    sfxTap();
  }
  function clearBlank(pi){
    var p = P[pi];
    if (!p || p.done || !race.running) return;
    p.q.pick = null;
    renderQuestion(p);
  }
  function clearAll(pi){ clearBlank(pi); }
  function submit(pi){
    var p = P[pi];
    if (!p || p.done || p.lock || !race.running) return;
    var q = p.q;
    if (q.pick === null){
      hint(p, '先点一个数字');
      sfxWrong();
      return;
    }
    var ok;
    if (q.blank === 'whole') ok = (q.pick === q.a + q.b);
    else if (q.blank === 'a') ok = (q.pick + q.b === q.whole);
    else ok = (q.a + q.pick === q.whole);
    if (ok) correct(p); else wrong(p);
  }

  function correct(p){
    p.score++;
    p.lock = true;
    var card = cardEl(p.i);
    card.classList.add('good');
    floatPlus(p);
    updateScore(p);
    updateRunner(p);
    sfxCorrect();
    setTimeout(function(){
      card.classList.remove('good');
      if (p.score >= CFG.goal){
        finishPlayer(p);
      } else {
        p.q = makeQuestion(p.q.whole);
        renderQuestion(p);
      }
      p.lock = false;
    }, 430);
  }

  function wrong(p){
    p.wrong++;
    p.lock = true;
    var card = cardEl(p.i);
    card.classList.add('bad');
    sfxWrong();
    setTimeout(function(){
      card.classList.remove('bad');
      p.q.pick = null;
      renderQuestion(p);
      p.lock = false;
    }, 520);
  }

  function finishPlayer(p){
    p.done = true;
    p.finishedAt = elapsed();
    race.order.push(p.i);
    p.q.pick = null;
    renderQuestion(p);
    var place = race.order.length;
    var medal = place === 1 ? '🥇' : place === 2 ? '🥈' : place === 3 ? '🥉' : '🏁';
    var slot = $('[data-medal="' + p.i + '"]');
    if (slot) slot.textContent = medal + ' 第 ' + place + ' 名冲线';
    var laneMedal = $('[data-lane-medal="' + p.i + '"]');
    if (laneMedal) laneMedal.textContent = medal;
    var card = cardEl(p.i);
    if (card) card.classList.add('finished');
    var dn = $('[data-done="' + p.i + '"]');
    if (dn){
      var em = $('[data-emblem="' + p.i + '"]');
      if (em) em.innerHTML = place <= 3 ? trophySVG(place) : '<div class="flag-badge">' + flagSVG() + '</div>';
      $('.done-title', dn).textContent = medal + ' 第 ' + place + ' 名冲线';
      $('.done-sub', dn).textContent = p.mascot.name + ' · 用时 ' + secText(p.finishedAt);
    }
    sfxWin();
    if (P.every(function(x){ return x.done; })){
      setTimeout(endRace, 950);
    }
  }

  /* ---------------- 赛程 ---------------- */
  function updateClock(){
    if (!race.running) return;
    $('#clock').textContent = '⏱ ' + clockText(elapsed());
  }

  function startRace(){
    $('#start').classList.add('hidden');
    $('#result').classList.add('hidden');
    $('#settingsDrawer').classList.add('hidden');

    buildUI();
    P = MASCOTS.slice(0, CFG.players).map(function(m, i){
      return {
        i: i, mascot: m, score: 0, wrong: 0, done: false,
        lock: true, finishedAt: null, q: makeQuestion(null)
      };
    });
    P.forEach(renderQuestion);
    race = { running:false, t0:0, timer:0, order:[] };
    $('#clock').textContent = '⏱ 00:00';

    countdown(function(){
      race.running = true;
      race.t0 = performance.now();
      P.forEach(function(p){ p.lock = false; });
      clearInterval(race.timer);
      race.timer = setInterval(updateClock, 200);
    });
  }

  function countdown(done){
    var el = $('#countdown');
    el.classList.remove('hidden');
    var seq = ['3','2','1','开始！'];
    var k = 0;
    (function step(){
      el.innerHTML = '<div class="cd-num' + (k === 3 ? ' go' : '') + '">' + seq[k] + '</div>';
      tone(k === 3 ? 880 : 440, 0, k === 3 ? .30 : .12, 'sine', .11);
      k++;
      if (k < seq.length) setTimeout(step, 700);
      else setTimeout(function(){ el.classList.add('hidden'); done(); }, 600);
    })();
  }

  function endRace(){
    race.running = false;
    clearInterval(race.timer);
    var ranked = P.slice().sort(function(a, b){
      var af = a.done ? a.finishedAt : Infinity;
      var bf = b.done ? b.finishedAt : Infinity;
      if (af !== bf) return af - bf;
      return b.score - a.score;
    });
    $('#rankList').innerHTML = ranked.map(function(p, idx){
      var rk;
      if (p.done && idx < 3) rk = trophySVG(idx + 1);
      else if (p.done) rk = flagSVG();
      else rk = (idx + 1);
      return '<div class="rank-row' + (idx === 0 ? ' first' : '') + '">' +
        '<span class="rk">' + rk + '</span>' +
        '<span class="who2">' + p.mascot.emoji + ' ' + (p.i + 1) + '号 · ' + p.mascot.name + '</span>' +
        '<span class="sc">' + p.score + '/' + CFG.goal + '</span>' +
        '<span class="tm">' + (p.done ? secText(p.finishedAt) : '未冲线') + '</span>' +
      '</div>';
    }).join('');
    var best = ranked[0];
    var winnerDone = best && best.done;
    $('#resultTitle').textContent = winnerDone
      ? best.mascot.emoji + ' ' + (best.i + 1) + '号 · ' + best.mascot.name + ' 夺冠！'
      : '本 局 结 束';
    $('#resultSub').textContent = winnerDone
      ? '用时 ' + secText(best.finishedAt) + ' · ' + best.score + '/' + CFG.goal + ' 题'
      : (best ? best.mascot.emoji + ' ' + (best.i + 1) + '号 · ' + best.mascot.name + ' 暂时领先（' + best.score + '/' + CFG.goal + '）' : '');
    $('#result').classList.remove('hidden');
  }

  function resetToStart(){
    race.running = false;
    clearInterval(race.timer);
    P = [];
    $('#result').classList.add('hidden');
    $('#countdown').classList.add('hidden');
    $('#settingsDrawer').classList.add('hidden');
    $('#clock').textContent = '⏱ 00:00';
    buildUI();
    syncSummary();
    $('#start').classList.remove('hidden');
  }

  /* ---------------- 设置 ---------------- */
  function syncSummary(){
    $('#sumPlayers').textContent = '👥 ' + CFG.players + ' 位选手';
    $('#sumRange').textContent = '🔢 ' + CFG.max + ' 以内';
    $('#sumGoal').textContent = '🏁 每人 ' + CFG.goal + ' 题';
    $('#goalChip').textContent = '🎯 ' + CFG.goal + ' 题';
  }

  function syncSettings(){
    $$('#settingsDrawer .seg').forEach(function(seg){
      var key = seg.dataset.key;
      $$('button', seg).forEach(function(b){
        var v = b.dataset.v;
        var on = (key === 'sound') ? ((v === '1') === !!CFG.sound) : (String(CFG[key]) === v);
        b.classList.toggle('on', on);
      });
    });
  }

  function syncSoundBtn(){
    $('#btnSound').textContent = CFG.sound ? '🔊' : '🔇';
  }

  /* ---------------- 绑定 ---------------- */
  $('#arena').addEventListener('click', function(e){
    var btn = e.target.closest('button');
    if (!btn) return;
    var pi = Number(btn.dataset.p);
    if (btn.classList.contains('num')) tapNumber(pi, Number(btn.dataset.num));
    else if (btn.classList.contains('blank')) clearBlank(pi);
    else if (btn.dataset.act === 'clear') clearAll(pi);
    else if (btn.dataset.act === 'ok') submit(pi);
  });

  $('#btnStart').addEventListener('click', function(){
    ensureAudio();
    startRace();
  });
  $('#btnAgain').addEventListener('click', function(){
    ensureAudio();
    startRace();
  });
  $('#btnHome').addEventListener('click', resetToStart);
  $('#btnOpenSettings').addEventListener('click', function(){
    syncSettings();
    $('#settingsDrawer').classList.remove('hidden');
  });
  $('#btnSettings').addEventListener('click', function(){
    syncSettings();
    $('#settingsDrawer').classList.remove('hidden');
  });
  $('#btnCancelSettings').addEventListener('click', function(){
    $('#settingsDrawer').classList.add('hidden');
  });
  $('#settingsDrawer').addEventListener('click', function(e){
    if (e.target === this) this.classList.add('hidden');
  });
  $('#btnApply').addEventListener('click', function(){
    saveCfg();
    resetToStart();
  });
  $('#btnEndNow').addEventListener('click', function(){
    $('#settingsDrawer').classList.add('hidden');
    if (!P.length) return;
    endRace();
  });
  $$('#settingsDrawer .seg button').forEach(function(btn){
    btn.addEventListener('click', function(){
      var key = btn.parentElement.dataset.key;
      var v = btn.dataset.v;
      if (key === 'sound') CFG.sound = (v === '1');
      else CFG[key] = Number(v);
      syncSettings();
      syncSummary();
      syncSoundBtn();
    });
  });
  $('#btnSound').addEventListener('click', function(){
    CFG.sound = !CFG.sound;
    if (CFG.sound) ensureAudio();
    saveCfg();
    syncSoundBtn();
    syncSettings();
    if (CFG.sound) sfxTap();
  });
  $('#btnFull').addEventListener('click', function(){
    if (!document.fullscreenElement){
      (document.documentElement.requestFullscreen || function(){}).call(document.documentElement);
    } else {
      (document.exitFullscreen || function(){}).call(document);
    }
  });

  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  document.addEventListener('dblclick', function(e){ e.preventDefault(); }, { passive:false });

  /* ---------------- 启动 ---------------- */
  buildUI();
  syncSettings();
  syncSoundBtn();
  syncSummary();
})();
</script>
</body>
</html>
